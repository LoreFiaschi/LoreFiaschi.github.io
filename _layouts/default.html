<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    {%- include sidebar.html -%}
    <main id="main">
      {{ content }}
      <footer class="site-footer">
        <span>&copy; {{ 'now' | date: "%Y" }} {{ site.data.profile.name }}</span>
        <span>Built with Jekyll on GitHub Pages</span>
      </footer>
    </main>
  </div>
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/scrollspy.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
